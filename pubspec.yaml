name: jobs
description: "Jobs & Professional Networking Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_database: ^11.3.1
  cloud_firestore: ^5.6.5
  google_fonts: ^6.2.1
  intl: ^0.19.0
  file_picker: ^10.3.3
  image_picker: ^1.2.1
  font_awesome_flutter: ^10.8.0
  shared_preferences: ^2.5.0
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
