name: jobs
description: "Jobs & Professional Networking Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_database: ^11.3.1
  cloud_firestore: ^5.6.5
  google_fonts: ^6.2.1
  intl: ^0.19.0
  file_picker: ^10.3.3
  image_picker: ^1.2.1
  font_awesome_flutter: ^10.8.0
  shared_preferences: ^2.5.0
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  cloud_functions: ^5.6.2
  agora_rtc_engine: ^6.6.4
  permission_handler: ^13.0.2
  firebase_messaging: ^15.2.10
  http: ^1.6.0
  flutter_local_notifications: ^22.3.1
  googleapis_auth: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
